[package]
name = "sahur-object-world"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension"]
extension = ["dep:godot"]

[dependencies]
rapier3d = { version = "=0.36.0", features = ["serde-serialize", "enhanced-determinism"] }
godot = { version = "=0.5.4", default-features = false, features = ["api-4-7"], optional = true }
serde = { version = "1.0", features = ["derive"] }
bincode = "=1.3.3"
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
